<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f3f">
  <title>Agropama</title>
  <style>
    :root { --green: #1f6f3f; --bg: #eef2ec; --panel: #fff; --text: #1b2a1f; --muted: #66756a; --border: #dde4da; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1511; --panel: #18211b; --text: #e6eee7; --muted: #93a397; --border: #2c3a30; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font: 16px/1.45 system-ui, sans-serif; color: var(--text);
      background: linear-gradient(170deg, var(--green) 0 260px, var(--bg) 260px); min-height: 100vh;
      display: grid; place-items: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 420px; background: var(--panel); border-radius: 16px; padding: 26px 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.18); }
    .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 26px; color: var(--green); }
    .brand p { margin: 0; color: var(--muted); }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
    input { font: inherit; color: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); }
    button { margin-top: 14px; width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--green);
      color: #fff; font: inherit; font-weight: 700; }
    button:disabled { opacity: .6; }
    .hint { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
    .error { background: #fbe6e3; color: #b0281a; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
    .loading { text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="logo.svg" alt="" width="56" height="56">
      <div><h1>Agropama</h1><p>Messagerie interne</p></div>
    </div>
    <p id="loading" class="loading" hidden>Connexion au serveur…</p>
    <form id="form" hidden>
      <div id="error" class="error" hidden></div>
      <label>Adresse du serveur de l'entreprise
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://messagerie.agropama.com" required>
      </label>
      <button id="go" type="submit">Continuer</button>
      <p class="hint">Cette adresse vous est fournie par l'administrateur. Elle n'est demandée qu'une seule fois.</p>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
